<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jokercad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="viewer"></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">jokercad</span>
    </div>
    <div id="providerBadge" class="provider-badge" hidden>
      <span class="provider-dot"></span>
      <span class="provider-label"></span>
    </div>
  </header>

  <div id="viewerToolbar">
    <button type="button" id="resetViewBtn" class="tool-btn" title="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
    </button>
    <button type="button" id="wireframeBtn" class="tool-btn" title="Toggle wireframe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5 12 3l10 5.5-10 5.5L2 8.5Z"/><path d="M2 8.5v7L12 21l10-5.5v-7"/><path d="M12 14v7"/></svg>
    </button>
    <div class="tool-divider"></div>
    <button type="button" id="downloadGlbBtn" class="tool-btn" title="Download GLB" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span>GLB</span>
    </button>
    <button type="button" id="downloadStlBtn" class="tool-btn" title="Download STL" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span>STL</span>
    </button>
    <div class="tool-divider"></div>
    <button type="button" id="codeToggleBtn" class="tool-btn" title="View generated code">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18-6-6 6-6"/><path d="m15 6 6 6-6 6"/></svg>
      <span>Code</span>
    </button>
  </div>

  <p id="viewerHint">Drag to orbit · Scroll to zoom</p>

  <aside id="panel">
    <div id="chatLog">
      <div id="emptyState">
        <h1>What do you want to build?</h1>
        <p>Describe a part in plain English — shape, dimensions, holes.</p>
        <div class="chips">
          <button type="button" class="chip">a 40×20×10mm box with a 4mm hole through the center</button>
          <button type="button" class="chip">a 30mm diameter, 8mm thick knob with a 6mm hexagonal hole through the center</button>
          <button type="button" class="chip">an L-bracket with 50mm arms, 5mm thick, with a 6mm mounting hole in each arm</button>
        </div>
      </div>
    </div>

    <form id="promptForm">
      <div class="input-row">
        <textarea id="promptInput" rows="1" placeholder="Describe a part…"></textarea>
        <button type="submit" id="sendBtn" title="Generate (⌘/Ctrl + Enter)">
          <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
          <svg class="icon-spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42 100"/></svg>
        </button>
      </div>
      <div class="input-hint">⌘/Ctrl + Enter to generate</div>
    </form>
  </aside>

  <div id="codeDrawer">
    <div class="drawer-header">
      <span>Generated code</span>
      <div class="drawer-actions">
        <button type="button" id="copyCodeBtn" class="text-btn">Copy</button>
        <button type="button" id="closeCodeBtn" class="icon-btn" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
    <pre id="codeView"></pre>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
